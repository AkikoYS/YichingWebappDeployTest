<!DOCTYPE html>
<html lang="ja">

<head>
    <script>
        /* tiny-ctx-boot: CSSより前に文脈フラグを立てる */
        (function () {
            const u = new URL(location.href), q = u.searchParams;
            const wantsPC = q.get('pc') === '1', wantsMobile = q.get('mobile') === '1';
            const onPCHome = /\/index\.html$/i.test(location.pathname);
            const onMobileHome = /index-mobile\.html$/i.test(location.pathname);
            const isSmall = matchMedia('(max-width:768px)').matches;
            const ctx = wantsPC ? 'pc' : wantsMobile ? 'mobile' : onPCHome ? 'pc' : onMobileHome ? 'mobile' : (isSmall ? 'mobile' : 'pc');

            // CSSがすぐ使えるよう <html> に即付与（フォールバック用）
            document.documentElement.setAttribute('data-context', ctx);

            // DOM構築後に <body> にも従来クラスを付与
            document.addEventListener('DOMContentLoaded', () => {
                document.body.classList.add(ctx === 'pc' ? 'ctx-pc' : 'ctx-mobile');
            });
        })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#310066">
    <title>易経くじ（スマホ版）</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style/style-mobile.css" />
    <link rel="icon" type="image/x-icon" sizes="32x32" href="./assets/icons/favicon-32x32_v2.ico">
    <link rel="icon" type="image/x-icon" sizes="16x16" href="./assets/icons/favicon-16x16_v2.ico">
    <link rel="manifest" href="manifest.json" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.7.4/lottie.min.js"></script>
    <script src="mobile-view.js"></script>
    <script src="https://use.typekit.net/mer0dxj.js"></script>
    <script>
        try {
            Typekit.load({
                async: true,
                families: ['uddigikyokasho-pro'],   // ← 明示指定
                loading() { console.log('[Typekit] loading'); },
                active() { console.log('[Typekit] active'); },
                inactive() { console.warn('[Typekit] inactive'); }
            });
        } catch (e) { console.error(e); }
    </script>
</head>

<body>
    <!-- 強制トリガー用（画面外に隠す） -->
    <span class="tk-uddigikyokasho-pro" style="position:absolute;left:-9999px">あいうえおABC123</span>
    <header class="mobile-header">

        <img src="./assets/images/title.svg" alt="易経くじロゴ" class="logo" />


        <div class="auth-hamburger-wrapper">
            <div class="hamburger" id="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>

        <!-- メニュー -->
        <nav class="nav-menu" id="nav-menu">
            <ul>
                <!-- ホーム：今いる“版”に戻る -->
                <li><a class="nav-link active" data-home-link aria-current="page">易経くじ</a></li>

                <!-- 他ページ：モバイル文脈をキープしたいので ?mobile=1 を付ける方針でOK -->
                <li><a href="about-iching.html?mobile=1" class="nav-link">易経とは</a></li>
                <li><a href="how-to.html?mobile=1" class="nav-link">占い方</a></li>
                <li><a href="hexagrams.html?mobile=1" class="nav-link">六十四卦</a></li>
                <li><a href="bagua.html?mobile=1" class="nav-link">八卦</a></li>
                <li><a href="how-to-read.html?mobile=1" class="nav-link">卦の見方</a></li>

                <!-- 相互リンク：どの端末からでも反対側を開ける（CSSで片側だけ表示） -->
                <li><a class="nav-link" data-switch="to-pc" href="index.html?pc=1">PC版 易経くじ</a></li>
                <li><a class="nav-link" data-switch="to-mobile" href="index-mobile.html?mobile=1">スマホ版 易経くじ</a></li>
            </ul>

    </header>
    <div id="confetti-lottie" class="confetti-animation"></div>
    <main>
        <!-- スピナー（背景） -->
        <div id="mainSpinner" class="spinner scale-visible">
            <div id="spinner-anim-wrapper">
                <div id="lottie-spinner"></div>
            </div>
        </div>

        <!-- screen1:スタート画面（ボタン） -->
        <section id="screen-start" class="screen centered active">
            <div class="section-body">
                <button id="startBtn" class="visible">占いを始める‼️</button>
            </div>
        </section>

        <!-- screen2: 本番スピナー画面 -->
        <section id="screen-spinner" class="screen centered hidden">

            <div class="instruction-wrap">
                <!-- 最初だけ出すガイド -->
                <p id="startInstruction" class="instruction visible">
                    こころに念じながら上爻が出るまでクリックを続けるよ。<br>まず一回クリックして
                </p>
                <!-- 爻ごとに出るメッセージ用（空で開始） -->
                <p id="instructionText" class="instruction tip line"></p>
            </div>
            <!-- ここに爻が1本ずつ積み上がる -->
            <div id="hexagram-build" class="hexagram-build">
                <div class="hex-slot" data-line="6"></div>
                <div class="hex-slot" data-line="5"></div>
                <div class="hex-slot" data-line="4"></div>
                <div class="hex-slot" data-line="3"></div>
                <div class="hex-slot" data-line="2"></div>
                <div class="hex-slot" data-line="1"></div>
            </div>


            <!-- 爻の結果表示（画面下部中央） -->
            <div class="section-body">
                <p id="koResult" class="ko-result line" aria-live="polite"></p>
            </div>
        </section>

        <!-- screen3: 卦の結果表示（本卦、変卦、裏卦、総卦、互卦） -->
        <section id="screen-result" class="screen hidden">
            <div id="result"></div>
        </section>

        <!-- screen4: 今後の展開 - 最後の1回クリック -->
        <section id="screen-future" class="screen centered hidden">
            <div class="instruction-wrap">
                <p id="futureInstruction" class="instruction visible enc-brackets">最後に１回だけクリック！</p>
                <!-- 卦を表示する領域 -->
                <div id="hexagram-build-future" class="hexagram-build"></div>
            </div>
        </section>

        <!-- screen5: 変爻の結果表示 -->
        <section id="screen-henko" class="screen hidden">
            <div id="changedLine" class="result"></div>
        </section>

        <!-- screen6: 総合的な易断 -->
        <section id="screen-final" class="screen hidden">

            <!-- ✅ 本文 -->
            <div id="final-fortune-wrapper" class="invisible">
                <div id="finalFortune">
                </div>

                <!-- ✅ 補足文 -->
                <div class="final-fortune-note invisible">
                    個別の占いたい内容にはAI易経助言（100円）もご提供しています。
                </div>
                <!-- ✅ ctaボタン -->
                <div class="cta-buttons invisible" id="final-cta">
                    <button id="purchase-button" class="cta-btn">有料版の占いへ</button>
                    <button id="reset-button" class="cta-btn">新しく占う</button>
                </div>
            </div>
        </section>
    </main>

    <!-- 指タップ誘導（オーバーレイ） -->
    <div id="tap-helper" aria-hidden="true">
        <div id="finger-lottie" class="finger-lottie"></div>
    </div>

    <!-- 画面下部に常に表示されるフッター 2つだけ-->
    <footer class="mobile-footer">
        <button id="btn-home" class="footer-btn" aria-label="最初に戻る">
            <svg viewBox="0 0 24 24" width="24" height="24">
                <path d="M3 12l9-9 9 9M4 10v10h5v-6h6v6h5V10" stroke="#333" stroke-width="2" fill="none"
                    stroke-linecap="round" stroke-linejoin="round" />
            </svg>
        </button>
        <button id="btn-contact" class="footer-btn" aria-label="問い合わせ">
            <svg viewBox="0 0 24 24" width="24" height="24">
                <path d="M4 4h16v12H5.17L4 17.17V4zm4 4h8m-8 4h4" stroke="#333" stroke-width="2" fill="none"
                    stroke-linecap="round" stroke-linejoin="round" />
            </svg>
        </button>
    </footer>
    <div id="nav-overlay" class="nav-overlay hidden">
    </div>

    <div id="hexagram-modal" class="modal hidden" aria-hidden="true">
        <div class="modal-content">
            <span class="close" aria-label="閉じる">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="logic.js" defer></script>
    <script src="script-mobile.js" defer></script>
    <script src="ui.js" defer></script>
    <script src="mobile-view.js" defer></script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .then(reg => console.log('✅ Service Worker registered', reg))
                    .catch(err => console.error('❌ Service Worker registration failed:', err));
            });
        }
    </script>

</body>

</html>
