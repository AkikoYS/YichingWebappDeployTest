<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>易経くじ（スマホ版）</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style/style-mobile.css" />
    <link rel="icon" type="image/x-icon" sizes="32x32" href="assets/icons/favicon-32x32_v2.ico">
    <link rel="icon" type="image/x-icon" sizes="16x16" href="assets/icons/favicon-16x16_v2.ico">
    <link rel="manifest" href="manifest.json" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.7.4/lottie.min.js"></script>
</head>

<body>
    <header class="mobile-header">
        <img src="assets/images/title.svg" alt="易経くじロゴ" class="logo" />

        <div class="auth-hamburger-wrapper">
            <div class="hamburger" id="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>

        <!-- メニュー -->
        <nav class="nav-menu" id="nav-menu">
            <ul>
                <li><span class="nav-link active">易経くじ</span></li>
                <li><a href="about-iching.html?mobile=1" class="nav-link">易経とは</a></li>
                <li><a href="how-to.html?mobile=1" class="nav-link">占い方</a></li>
                <li><a href="hexagrams.html?mobile=1" class="nav-link">六十四卦</a></li>
                <li><a href="bagua.html?mobile=1" class="nav-link">八卦</a></li>
                <li><a href="how-to-read.html?mobile=1" class="nav-link">卦の見方</a></li>
                <!-- <li><a href="log.html" class="nav-link">ログ一覧</a></li> -->
            </ul>
        </nav>
    </header>
    <main>
        <!-- スピナー（背景） -->
        <div id="mainSpinner" class="spinner scale-visible">
            <div id="spinner-anim-wrapper">
            <div id="lottie-spinner"></div></div>
        </div>

        <!-- スタート画面（ボタン） -->
        <section id="screen-start" class="screen active">
            <div class="section-body">
                <button id="startBtn" class="visible">占いを始める</button>
            </div>
        </section>

            <!-- 本番スピナー画面 -->
            <section id="screen-spinner" class="screen hidden">
                <div class="section-body">
                    <p id="instructionText" class="instruction visible">こころに念じながら6回クリックしてください</p>
                </div>
            </section>

            <!-- 結果画面 -->
            <section id="screen-result" class="screen hidden">
                <div class="result">
                    <div id="variantButtons" class="variant-buttons">
                        <button class="variant-btn" data-key="future-expansion">今後の展開</button>
                        <button class="variant-btn" data-key="reverse">裏の意味</button>
                        <button class="variant-btn" data-key="sou">客観的に運命を見ると</button>
                        <button class="variant-btn" data-key="go">卦の本質は</button>
                    </div>
                    <div class="hexagram-title">第11卦：<ruby>地天泰<rt>ちてんたい</rt></ruby><span
                            style="font-size: 0.8em;">—☷☰</span></div>
                    <div class="hexagram-reading" style="text-align: center;">物事が順調に進む時期</div>
                    <div class="hexagram-svg">
                        <object data="assets/images/hexagrams/hexagram_11.svg" type="image/svg+xml"></object>
                    </div>
                    <div class="description-text">これはテストの説明です。<br>改行も反映されます。</div>
                    <div class="description-image">⚪︎イメージ：春の野を歩く</div>
                    <button id="futureBtn" class="main-btn">今後の展開</button>
                </div>
            </section>

            <!-- 今後の展開ボタン -->
            <section id="screen-future" class="screen hidden">
                <div class="section-body">
                    <p id="instructionText" class="instruction visible">最後に１回クリックしてください</p>
                </div>
            </section>


            <!-- 変爻 -->
            <section id="screen-future" class="screen hidden">
                <div class="section-body">
                    <div class="hexagram-title">変卦結果表示（仮）</div>
                </div>
            </section>


            <!-- 易断 -->
            <section id="screen-final" class="screen hidden">
                <div class="section-body">
                    <div class="hexagram-title">総合的な易断（仮）</div>
                </div>
            </section>
    </main>

    <!-- 画面下部に常に表示されるフッター -->
    <footer class="mobile-footer">
        <button id="btn-back" class="footer-btn" aria-label="前に戻る">
            <svg viewBox="0 0 24 24" width="24" height="24">
                <path d="M15 18l-6-6 6-6" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"
                    stroke-linejoin="round" />
            </svg>
        </button>
        <button id="btn-next" class="footer-btn" aria-label="先に進む">
            <svg viewBox="0 0 24 24" width="24" height="24">
                <path d="M9 18l6-6-6-6" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"
                    stroke-linejoin="round" />
            </svg>
        </button>
        <button id="btn-home" class="footer-btn" aria-label="最初に戻る">
            <svg viewBox="0 0 24 24" width="24" height="24">
                <path d="M3 12l9-9 9 9M4 10v10h5v-6h6v6h5V10" stroke="#333" stroke-width="2" fill="none"
                    stroke-linecap="round" stroke-linejoin="round" />
            </svg>
        </button>
        <button id="btn-contact" class="footer-btn" aria-label="問い合わせ">
            <svg viewBox="0 0 24 24" width="24" height="24">
                <path d="M4 4h16v12H5.17L4 17.17V4zm4 4h8m-8 4h4" stroke="#333" stroke-width="2" fill="none"
                    stroke-linecap="round" stroke-linejoin="round" />
            </svg>
        </button>
    </footer>
    <div id="nav-overlay" class="nav-overlay hidden">
    </div>
    <script src="script-mobile.js" defer></script>
    <script src="logic.js" defer></script>
    <script src="ui.js" defer></script>

</body>

</html>
