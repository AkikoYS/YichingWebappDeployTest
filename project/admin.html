<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>送信状況ダッシュボード</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="./firebase/env.js"></script>
    <script type="module" src="./admin.js"></script>
</head>

<body class="bg-gray-50 font-sans">
    <div class="max-w-6xl mx-auto p-6">
        <h1 class="text-2xl font-bold mb-4">PDF送信状況ダッシュボード</h1>
        <table class="min-w-full bg-white shadow-md rounded-lg overflow-hidden">
            <thead class="bg-gray-200">
                <tr>
                    <th class="text-left px-4 py-2">UID</th>
                    <th class="text-left px-4 py-2">Email</th>
                    <th class="text-left px-4 py-2">ステータス</th>
                    <th class="text-left px-4 py-2">作成日時</th>
                    <th class="text-left px-4 py-2">送信日時</th>
                    <th class="text-left px-4 py-2">操作</th>
                </tr>
            </thead>
            <tbody id="dashboard-body">
                <!-- データ行は admin.js で生成 -->
            </tbody>
        </table>
    </div>
</body>

</html>
