<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>ご意見・ご要望フォーム | 易経くじ</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style/style.css">
    <link rel="stylesheet" href="style/note-style.css">
    <link rel="stylesheet" href="style/base.css">
    <script>
        // クエリに ?mobile=1 がついていたら sessionStorage に記録
        if (location.search.includes("mobile=1")) {
            sessionStorage.setItem("fromMobile", "true");
        }

        // 易経くじに戻るリンクをスマホ向けに変更（存在する場合のみ）
        document.addEventListener("DOMContentLoaded", () => {
            if (sessionStorage.getItem("fromMobile") === "true") {
                const backLink = document.querySelector('a[href="index.html"]');
                if (backLink) {
                    backLink.setAttribute("href", "index-mobile.html");
                }
            }
        });
    </script>
</head>

<body>
    <!-- <div class="background-image"></div> -->
    <!-- <header>
        <h1>📝 ご意見・ご要望フォーム</h1>
    </header> -->

    <main>
        <p class="description">
            アプリを使って感じたこと、改善してほしいことなど、ぜひお聞かせください。<br>
            匿名でもOKです！
        </p>


        <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSfWHKoiHjovQGJOv4FDIXIKhLlQU3sIixUfUSBXFSMKAYuNkg/viewform?usp=sharing&ouid=100494685351212212860
        " allowfullscreen></iframe>

        <div class="back-link">
            <a href="index.html" class="variant-button" style="color: white;">易経くじに戻る</a>
        </div>
    </main>

    <footer class="simple-footer">
        &copy; 2025 YiChingApp
    </footer>
</body>

</html>
